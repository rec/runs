[project]
name = "runs"
version = "1.3.0"
description = "🏃 Run a block of text as a subprocess 🏃"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.10"
readme = "README.rst"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
dependencies = ["xmod"]

[tool.doks]
auto = true

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "tdir",
    "ruff",
    "pyupgrade>=3.21.2",
    "ty>=0.0.14",
]

[tool.coverage.run]
branch = true
source = ["runs"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
exclude_lines = ["pragma: no cover", "if False:", "if __name__ == .__main__.:", "raise NotImplementedError"]


[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"


[tool.poetry]
name = "runs"
version = "0.1.0"
description = "🏃 Run a block of text as a subprocess 🏃"
authors = ["Tom Ritchford <tom@swirly.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
